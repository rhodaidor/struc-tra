<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="structra-stacked-gradient" x1="45" y1="20" x2="195" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="structra-doc-gradient" x1="100" y1="56" x2="158" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <!-- Top Icon -->
  <g transform="translate(30, 8) scale(0.52)">
    <rect x="20" y="112" width="8" height="8" rx="2.5" fill="#7C3AED" opacity="0.55" />
    <rect x="34" y="96" width="10" height="10" rx="3" fill="#8B5CF6" opacity="0.75" />
    <rect x="50" y="80" width="12" height="12" rx="3.5" fill="#6366F1" opacity="0.90" />
    <rect x="68" y="64" width="14" height="14" rx="4" fill="#3B82F6" opacity="1.0" />

    <rect x="100" y="54" width="56" height="76" rx="10" fill="url(#structra-doc-gradient)" stroke="#CBD5E1" stroke-width="2" />
    <path d="M 142 54 V 68 H 156 L 142 54 Z" fill="#94A3B8" />

    <line x1="112" y1="78" x2="142" y2="78" stroke="#7C3AED" stroke-width="4.5" stroke-linecap="round" />
    <line x1="112" y1="92" x2="138" y2="92" stroke="#6366F1" stroke-width="4.5" stroke-linecap="round" />
    <line x1="112" y1="106" x2="130" y2="106" stroke="#2563EB" stroke-width="4.5" stroke-linecap="round" />

    <path
      d="M 176 52 C 176 32, 140 22, 114 28 C 86 34, 74 62, 84 90 C 96 122, 156 126, 172 152 C 188 178, 174 208, 138 218 C 102 228, 76 210, 80 192"
      stroke="url(#structra-stacked-gradient)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Clean Wordmark "tructra" centered below Icon -->
  <text
    x="100"
    y="172"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="30"
    font-weight="600"
    letter-spacing="-0.8"
    fill="#0F172A"
  >
    tructra
  </text>
</svg>
