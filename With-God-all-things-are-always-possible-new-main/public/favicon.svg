<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="fav-ribbon" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="32" height="32" rx="8" fill="#0F172A" />
  
  <!-- Scattered transition pixels -->
  <rect x="3.5" y="15" width="1.5" height="1.5" rx="0.4" fill="#7C3AED" opacity="0.6" />
  <rect x="5.5" y="12.5" width="1.8" height="1.8" rx="0.5" fill="#8B5CF6" opacity="0.8" />
  <rect x="8" y="10" width="2" height="2" rx="0.5" fill="#6366F1" />

  <!-- Integrated Doc Card -->
  <rect x="14" y="8" width="8" height="10" rx="1.5" fill="#FFFFFF" opacity="0.95" />
  <line x1="15.5" y1="11" x2="19.5" y2="11" stroke="#7C3AED" stroke-width="0.8" stroke-linecap="round" />
  <line x1="15.5" y1="13" x2="19" y2="13" stroke="#2563EB" stroke-width="0.8" stroke-linecap="round" />

  <!-- "S" Ribbon in favicon (extra thick) -->
  <path
    d="M 23 7.5 C 23 5, 18 4, 14.5 5 C 11 6, 9.5 9.5, 10.5 13 C 12 17, 20 17.5, 22 21 C 24 24.5, 22.5 28, 18 29 C 13.5 30, 10 27.5, 10.5 25"
    stroke="url(#fav-ribbon)"
